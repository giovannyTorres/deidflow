[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deidflow"
version = "0.4.0"
description = "Local-first Spanish and Mexican sensitive-data detection and verified transformations"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Giovanny Torres"}]
keywords = [
    "anonymization",
    "de-identification",
    "pii",
    "phi",
    "privacy",
    "redaction",
    "pseudonymization",
    "spanish",
    "mexico",
    "ner",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/giovannyTorres/deidflow"
Repository = "https://github.com/giovannyTorres/deidflow"
Issues = "https://github.com/giovannyTorres/deidflow/issues"
Changelog = "https://github.com/giovannyTorres/deidflow/blob/master/CHANGELOG.md"
Security = "https://github.com/giovannyTorres/deidflow/blob/master/SECURITY.md"

[project.optional-dependencies]
nlp = ["spacy>=3.8,<3.9"]
pdf = ["pypdf>=6.21.4,<7"]
ocr = ["Pillow>=13,<14", "pypdfium2>=5.14,<6"]
ocr-build = ["certifi>=2026.10.23,<2027"]
tables = ["pandas>=2.2,<3", "polars>=1.30,<2", "pyarrow>=20,<24"]
yaml = ["PyYAML>=6.0.2,<7"]
training = ["numpy>=1.26,<3", "scikit-learn>=1.6,<1.10", "joblib>=1.4,<2", "faker>=30,<41"]
benchmarks = ["psutil>=7,<8", "reportlab>=4.4,<5"]
baselines = ["presidio-analyzer>=2.2,<3", "spacy>=3.8,<3.9"]
private-gmail = ["google-auth>=2.40,<3", "google-auth-oauthlib>=1.2,<2"]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "python-stdnum>=2,<3", "hypothesis>=6.135,<7", "ruff>=0.12,<1", "mypy>=1.16,<2", "build>=1.2,<2", "pip-audit>=2.9,<3"]

[project.scripts]
deidflow = "deidflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deidflow"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/benchmarks/public-sources",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:deidflow.*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/deidflow"]

[[tool.mypy.overrides]]
module = ["yaml", "joblib.*", "sklearn.*", "pytesseract.*", "pandas.*", "reportlab.*", "psutil.*"]
ignore_missing_imports = true
follow_untyped_imports = false
