name: release
# Builds, attests and attaches release artifacts when a version tag is pushed.
# Publishing to PyPI is opt-in: configure a PyPI trusted publisher for this
# repository and workflow, create a protected "pypi" environment, then set the
# repository variable PUBLISH_TO_PYPI to "true".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check that the tag matches the package version
        shell: bash
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: python -m pip install --upgrade pip build twine pip-audit
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Software bill of materials (all optional extras)
        run: |
          python -m pip install "$(ls dist/*.whl)[pdf,ocr,tables,yaml,training,nlp]"
          python -m pip_audit --format cyclonedx-json --output dist/deidflow-sbom.cdx.json
      - name: SHA-256 checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  github-release:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    needs: attest
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Keep only Python distributions
        run: rm -f dist/SHA256SUMS dist/*.json
      - uses: pypa/gh-action-pypi-publish@release/v1
