name: release
# Builds, attests and attaches release artifacts when a version tag is pushed.
# Publishing to PyPI is opt-in: configure a PyPI trusted publisher for this
# repository and workflow, create a protected "pypi" environment, then set the
# repository variable PUBLISH_TO_PYPI to "true".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check that the tag matches the package version
        shell: bash
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: python -m pip install --upgrade pip build twine pip-audit
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Software bill of materials (all optional extras)
        run: |
          python -m pip install "$(ls dist/*.whl)[pdf,ocr,tables,yaml,training,nlp,vault]"
          python -m pip_audit --format cyclonedx-json --output dist/deidflow-sbom.cdx.json
      - name: SHA-256 checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/
      - uses: actions/attest-build-provenance@v4
        id: provenance
        with:
          create-storage-record: false
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Preserve the signed provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          mkdir -p provenance
          cp "$BUNDLE_PATH" provenance/deidflow-provenance.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: release-provenance
          path: provenance/*.jsonl
          if-no-files-found: error

  github-release:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Release notes from the CHANGELOG section of this version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## ${version} " 'index($0, h) == 1 {on = 1; next} on && /^## / {exit} on {print}' \
            CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md" || { echo "no CHANGELOG section for ${version}"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: release-provenance
          path: provenance/
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            provenance/*.jsonl
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true

  pypi:
    needs: attest
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist/
      - name: Prepare only Python distributions
        run: |
          mkdir -p pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
