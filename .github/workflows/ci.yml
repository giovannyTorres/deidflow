name: checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade "pip>=26.2" "setuptools>=84.1"
      - run: python -m pip install -e ".[dev,pdf,ocr,tables,yaml,training,benchmarks,nlp,private-gmail]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src/deidflow
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/benchmark_micro.py --check
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade "pip>=26.2" "setuptools>=84.1"
      - run: python -m pip install -e ".[dev,pdf,ocr,tables,yaml,training,benchmarks,nlp,private-gmail]"
      - run: python -m pip_audit
      - run: python scripts/audit_licenses.py
