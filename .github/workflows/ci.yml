name: checks
on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pdf,ocr,tables,yaml,training,benchmarks,nlp,private-gmail]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --python-version ${{ matrix.python }} src/deidflow
      - name: Tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.13') }}
        run: python -m pytest -q
      - name: Tests with coverage gate
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' }}
        run: python -m pytest -q --cov=deidflow --cov-report=term --cov-fail-under=78
      - run: python scripts/benchmark_micro.py --check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel without any optional dependency
        shell: bash
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-smoke/bin/deidflow --version
          /tmp/wheel-smoke/bin/python - <<'EOF'
          import importlib.util
          assert importlib.util.find_spec("numpy") is None, "base wheel must not pull NumPy"
          from deidflow import DeidEngine
          from deidflow.nlp.tagger import BUILTIN_MODELS, SpanTagger
          for name in BUILTIN_MODELS:
              tagger = SpanTagger.builtin(name)
              assert not tagger.accelerated
              text = "Nombre: Ernesto Rivera Bueno.\nNHC: 368503.\n"
              result = DeidEngine(nlp=tagger).deidentify_text(text)
              assert "368503" not in result.output_text
          print("wheel smoke test passed", sorted(BUILTIN_MODELS))
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pdf,ocr,tables,yaml,training,benchmarks,nlp,private-gmail]"
      - run: python -m pip_audit --skip-editable
      - run: python scripts/audit_licenses.py
