name: checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade "pip>=26.2" "setuptools>=84.1"
      - run: python -m pip install -e ".[dev,pdf,ocr,tables,yaml,training,benchmarks,nlp,private-gmail,vault]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --python-version ${{ matrix.python }} src/deidflow
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/benchmark_micro.py --check
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade "pip>=26.2" "setuptools>=84.1"
      - run: python -m pip install -e ".[dev,pdf,ocr,tables,yaml,training,benchmarks,nlp,private-gmail,vault]"
      - run: python -m pip_audit
      - run: python scripts/audit_licenses.py
  public-quality:
    # Leakage ratchet on the public MEDDOCAN test split (audit F0.5). Thresholds sit just
    # below the measured v0.4 rules-only values; raise them as detection improves.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade "pip>=26.2" "setuptools>=84.1"
      - run: python -m pip install -e ".[benchmarks]"
      - run: |
          git clone --filter=blob:none https://github.com/PlanTL-GOB-ES/SPACCC_MEDDOCAN "$RUNNER_TEMP/meddocan-src"
          git -C "$RUNNER_TEMP/meddocan-src" checkout --quiet 783a6df385c975b328c99bcffb54196a9ba4078a
      - run: python scripts/acquire_public_corpus.py meddocan --from-checkout "$RUNNER_TEMP/meddocan-src" --destination "$RUNNER_TEMP/corpora"
      - run: >-
          python scripts/audit_public_breakdown.py --corpus "$RUNNER_TEMP/corpora/meddocan"
          --ci-repeats 50 --min-direct-coverage 0.905 --min-fully-covered 0.795
          --max-direct-leak-documents 132 > /dev/null
