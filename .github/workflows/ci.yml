name: checks
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-constraints-windows-py311.txt
      - run: python -m pip install --upgrade pip
      - name: Install reviewed Windows constraints
        if: ${{ matrix.os == 'windows-latest' && matrix.python == '3.11' }}
        run: python -m pip install -c requirements-constraints-windows-py311.txt -e ".[dev,pdf,ocr,tables,yaml,training,benchmarks,nlp,private-gmail,vault]"
      - name: Install supported dependencies
        if: ${{ !(matrix.os == 'windows-latest' && matrix.python == '3.11') }}
        run: python -m pip install -e ".[dev,pdf,ocr,tables,yaml,training,benchmarks,nlp,private-gmail,vault]"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --python-version ${{ matrix.python }} src/deidflow
      - name: Tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.13') }}
        run: python -m pytest -q
      - name: Tests with coverage gate
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' }}
        run: python -m pytest -q --cov=deidflow --cov-report=term --cov-fail-under=78
      - run: python scripts/benchmark_micro.py --check

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the wheel without any optional dependency
        shell: bash
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-smoke/bin/deidflow --version
          /tmp/wheel-smoke/bin/python - <<'EOF'
          import importlib.util
          assert importlib.util.find_spec("numpy") is None, "base wheel must not pull NumPy"
          assert importlib.util.find_spec("cryptography") is None, "vault encryption must remain optional"
          from deidflow import DeidEngine, DeidSession, get_domain_pack
          from deidflow.nlp.tagger import BUILTIN_MODELS, SpanTagger
          for name in BUILTIN_MODELS:
              tagger = SpanTagger.builtin(name)
              assert not tagger.accelerated
              text = "Nombre: Ernesto Rivera Bueno.\nNHC: 368503.\n"
              result = DeidEngine(nlp=tagger).deidentify_text(text)
              assert "368503" not in result.output_text
          from pathlib import Path
          from tempfile import TemporaryDirectory
          with get_domain_pack("clinical").session() as session:
              assert isinstance(session, DeidSession)
              source = "Paciente: Ana López niega diabetes y toma metformina 500 mg."
              first = session.deidentify(source)
              second = session.deidentify(source)
              assert first.output_text == second.output_text
              assert "Ana López" not in first.output_text
              assert "metformina 500 mg" in first.output_text and "niega diabetes" in first.output_text
              assert first.status == second.status == "REVIEW_REQUIRED"
              assert session.reidentify(second.output_text).text == source
              assert len(session.graph()["entities"]) == 1
              assert len(session.graph()["documents"]) == 2
              with TemporaryDirectory() as temporary:
                  destination = Path(temporary) / "session.enc"
                  try:
                      session.save(destination, key=b"k" * 32)
                  except ImportError:
                      pass
                  else:
                      raise AssertionError("encrypted sessions must require the vault extra")
                  assert not destination.exists()
          print("wheel smoke test passed", sorted(BUILTIN_MODELS))
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,pdf,ocr,tables,yaml,training,benchmarks,nlp,private-gmail,vault]"
      - run: python -m pip_audit --skip-editable
      - run: python scripts/audit_licenses.py
